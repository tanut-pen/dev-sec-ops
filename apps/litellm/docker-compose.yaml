services:

  # ─────────────────────────────────────────────
  # PostgreSQL — LiteLLM model/key storage backend
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: litellm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm}
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_DB:-litellm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # LiteLLM Proxy
  # ─────────────────────────────────────────────
  litellm:
    image: docker.litellm.ai/berriai/litellm:v1.88.0
    container_name: litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    command: ["--config", "/app/config.yaml"]
    volumes:
      - ./config/config.yaml:/app/config.yaml:ro
    environment:
      # Database — must match the postgres service above
      DATABASE_URL: ${DATABASE_URL:-postgresql://litellm:litellm@postgres:5432/litellm}

      # Master key — used to authenticate requests to the proxy
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-change-me}

      # Optional: Jenkins basic auth for MCP server integration
      JENKINS_BASIC_AUTH: ${JENKINS_BASIC_AUTH:-}

      # Optional: expose the UI
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${UI_PASSWORD:-admin}

volumes:
  postgres_data:
