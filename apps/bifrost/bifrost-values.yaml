# Bifrost AI Gateway Helm values
# Ref: https://github.com/maximhq/bifrost/tree/main/helm-charts/bifrost
# Chart repo: https://maximhq.github.io/bifrost/helm-charts

replicaCount: 1

image:
  repository: docker.io/maximhq/bifrost
  pullPolicy: IfNotPresent
  tag: "v1.4.11"

service:
  type: NodePort
  port: 8080
  nodePort: 30008

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: bifrost.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

storage:
  mode: sqlite
  persistence:
    enabled: true
    size: 5Gi

bifrost:
  enableLogging: true
  # For production, prefer referencing a Kubernetes Secret:
  # encryptionKeySecret:
  #   name: "bifrost-encryption-key"
  #   key: "encryption-key"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

