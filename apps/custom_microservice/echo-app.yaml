apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: echo
  namespace: demo
  labels:
    app: echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  strategy:
    blueGreen:
      activeService: echo
      previewService: echo-preview
      autoPromotionEnabled: false
  template:
    metadata:
      labels:
        app: echo
      # annotations:
        # vault.hashicorp.com/agent-inject: "true"
        # vault.hashicorp.com/role: "demo-app"

        # vault.hashicorp.com/agent-inject-secret-db: "demo/db/data/postgres"
        # vault.hashicorp.com/agent-inject-template-db: |
        #   {{- with secret "demo/db/data/postgres" -}}
        #   DB_USERNAME={{ .Data.data.DB_USERNAME }}
        #   DB_PASSWORD={{ .Data.data.DB_PASSWORD }}
        #   {{- end }}

        # vault.hashicorp.com/agent-inject-perms-db: "0400"
        # vault.hashicorp.com/agent-inject-token: "false"

    spec:
      serviceAccountName: demo-app
      containers:
        - name: echo
          image: ealen/echo-server:latest
          ports:
            - containerPort: 80
          env:
            - name: PORT
              value: "80"
            - name: NAME
              value: "ICE"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: demo
spec:
  selector:
    app: echo
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: echo-preview
  namespace: demo
spec:
  selector:
    app: echo
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-app
  namespace: demo