---
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
    path_prefix: /var/loki
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  
  persistence:
    enabled: true
    size: 5Gi
    # Will use the default StorageClass (local-path) in the k3d cluster

# Gateway configuration (NGINX proxy for routing traffic to Loki)
gateway:
  enabled: true
  service:
    type: ClusterIP
    port: 80

# Disable scalable targets explicitly when running SingleBinary
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
